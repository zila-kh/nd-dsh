[package]
name = "nd-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
# Git-compatible ignore matching for the workspace revision walk and content search.
ignore = "0.4"
portable-pty = "0.9.0"
# Literal and regex matching for bounded workspace content search.
regex = "1"
rmp-serde = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1.20", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
rmp-serde = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.20", features = ["v4"] }
serde_bytes = "0.11"

[package]
name = "nd-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
nd-protocol = { path = "../nd-protocol" }
nd-runtime = { path = "../nd-runtime" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rmp-serde = "1.3"
serde_bytes = "0.11"
uuid = { version = "1.20", features = ["v4"] }

name: benchmark-proof

on:
  workflow_dispatch:
  push:
    branches:
      - feat/rust-shared-core-mvp

permissions:
  contents: read

concurrency:
  group: benchmark-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bench-proof]')
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install desktop dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Record full PRD 0002 performance evidence
        run: corepack pnpm bench:record
        env:
          CI: 'true'
          ND_DSH_BENCH_OUTPUT: benchmark-results/mvp-proof
          ND_DSH_BENCH_RUNS: '10'
          ND_DSH_BENCH_PROFILE: release
          ND_DSH_BENCH_FIXTURE_REVISION: prd-0002-v1
      - name: Re-check budgets from raw evidence
        if: success()
        run: corepack pnpm bench:check benchmark-results/mvp-proof/summary.json
      - name: Upload benchmark proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-sidecar-mvp-performance-proof
          path: benchmark-results/mvp-proof
          if-no-files-found: error

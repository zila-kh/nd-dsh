<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">ND multi-company AI company workflow</title>
  <desc id="desc">One ND control plane manages multiple companies, projects, parallel task workers, isolated task workspaces, verification, review and integration.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#d8e0ec;stroke-width:2}.blue{fill:#eef6ff;stroke:#86b8ff}.green{fill:#effbf5;stroke:#86d8b1}.purple{fill:#f5f1ff;stroke:#b6a0ee}.task{fill:#fff;stroke:#b8c7dc}.title{font:700 38px system-ui,sans-serif;fill:#102344}.h1{font:700 25px system-ui,sans-serif;fill:#102344}.h2{font:700 18px system-ui,sans-serif;fill:#17345f}.body{font:14px system-ui,sans-serif;fill:#4a6386}.small{font:12px system-ui,sans-serif;fill:#60799a}.chip{font:700 12px system-ui,sans-serif;fill:#17345f}.arrow{stroke:#7894b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#a889e8;stroke-width:2;stroke-dasharray:7 7;fill:none}.status{fill:#e9f8ef;stroke:#71c994}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7894b8"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1050"/>
  <text x="45" y="58" class="title">Multi-Company AI Company Workflow</text>
  <text x="45" y="86" class="body">One ND control plane → multiple companies → multiple projects → multiple isolated task workers</text>

  <rect x="45" y="115" rx="18" ry="18" width="1260" height="105" class="panel"/>
  <rect x="70" y="137" rx="12" width="90" height="62" fill="#173b70"/>
  <text x="94" y="178" font-family="system-ui,sans-serif" font-size="30" font-weight="800" fill="#fff">ND</text>
  <text x="185" y="158" class="h1">ND Control Plane</text>
  <text x="185" y="184" class="body">Companies · projects · workers · memory · policy · verification · review · integration</text>
  <text x="1000" y="159" class="chip">ENGINES ARE EXECUTORS</text>
  <text x="1000" y="183" class="small">ND owns durable task truth and evidence</text>

  <path d="M280 220 V245" class="arrow"/><path d="M690 220 V245" class="arrow"/><path d="M1080 220 V245" class="arrow"/>

  <rect x="45" y="250" rx="16" width="380" height="205" class="blue"/>
  <text x="70" y="285" class="h1">Taxi Co</text><text x="70" y="308" class="body">Company chat · memory · employees · policy/budget</text>
  <rect x="70" y="330" rx="10" width="155" height="95" class="panel"/><text x="90" y="360" class="h2">Taxi App</text><text x="90" y="386" class="small">Scrum board</text><text x="90" y="406" class="small">Project chat · repo</text>
  <rect x="245" y="330" rx="10" width="155" height="95" class="panel"/><text x="265" y="360" class="h2">Admin</text><text x="265" y="386" class="small">Fleet board</text><text x="265" y="406" class="small">Project context</text>

  <rect x="445" y="250" rx="16" width="380" height="205" class="green"/>
  <text x="470" y="285" class="h1">Ecommerce Co</text><text x="470" y="308" class="body">Company chat · memory · employees · policy/budget</text>
  <rect x="470" y="330" rx="10" width="155" height="95" class="panel"/><text x="490" y="360" class="h2">Store</text><text x="490" y="386" class="small">Scrum board</text><text x="490" y="406" class="small">Project chat · repo</text>
  <rect x="645" y="330" rx="10" width="155" height="95" class="panel"/><text x="665" y="360" class="h2">Seller</text><text x="665" y="386" class="small">Dashboard board</text><text x="665" y="406" class="small">Project context</text>

  <rect x="845" y="250" rx="16" width="380" height="205" class="purple"/>
  <text x="870" y="285" class="h1">SaaS Co</text><text x="870" y="308" class="body">Company chat · memory · employees · policy/budget</text>
  <rect x="870" y="330" rx="10" width="155" height="95" class="panel"/><text x="890" y="360" class="h2">Web App</text><text x="890" y="386" class="small">Scrum board</text><text x="890" y="406" class="small">Project chat · repo</text>
  <rect x="1045" y="330" rx="10" width="155" height="95" class="panel"/><text x="1065" y="360" class="h2">Analytics</text><text x="1065" y="386" class="small">Data board</text><text x="1065" y="406" class="small">Project context</text>

  <rect x="1330" y="115" rx="16" width="225" height="340" class="panel"/>
  <text x="1355" y="150" class="h2">Isolation Rules</text>
  <text x="1355" y="180" class="body">1 · Company = business</text><text x="1373" y="200" class="small">boundary</text>
  <text x="1355" y="232" class="body">2 · Project = board + repo</text><text x="1373" y="252" class="small">and project context</text>
  <text x="1355" y="284" class="body">3 · Task = writable</text><text x="1373" y="304" class="small">transaction boundary</text>
  <text x="1355" y="336" class="body">4 · Independent tasks</text><text x="1373" y="356" class="small">use separate workspaces</text>
  <text x="1355" y="388" class="body">5 · Teams share knowledge</text><text x="1373" y="408" class="small">not dirty working trees</text>

  <rect x="45" y="485" rx="18" width="1260" height="430" class="panel"/>
  <text x="70" y="525" class="h1">Taxi App · Detailed Project Workflow</text>
  <text x="70" y="550" class="body">Plan → dependency graph → parallel task transactions → checkpoint → verify → review → integrate</text>

  <g>
    <rect x="70" y="580" rx="10" width="120" height="50" class="blue"/><text x="105" y="610" class="chip">1 · PLAN</text>
    <path d="M190 605 H215" class="arrow"/>
    <rect x="220" y="580" rx="10" width="135" height="50" class="blue"/><text x="242" y="610" class="chip">2 · TASK GRAPH</text>
    <path d="M355 605 H380" class="arrow"/>
    <rect x="385" y="580" rx="10" width="145" height="50" class="green"/><text x="404" y="610" class="chip">3 · ASSIGN</text>
    <path d="M530 605 H555" class="arrow"/>
    <rect x="560" y="580" rx="10" width="165" height="50" class="purple"/><text x="579" y="610" class="chip">4 · PARALLEL</text>
    <path d="M725 605 H750" class="arrow"/>
    <rect x="755" y="580" rx="10" width="135" height="50" fill="#fff8e8" stroke="#eac56c"/><text x="772" y="610" class="chip">5 · CHECKPOINT</text>
    <path d="M890 605 H915" class="arrow"/>
    <rect x="920" y="580" rx="10" width="110" height="50" class="blue"/><text x="946" y="610" class="chip">6 · VERIFY</text>
    <path d="M1030 605 H1055" class="arrow"/>
    <rect x="1060" y="580" rx="10" width="110" height="50" fill="#fff0f5" stroke="#e49ab5"/><text x="1082" y="610" class="chip">7 · REVIEW</text>
    <path d="M1170 605 H1195" class="arrow"/>
    <rect x="1200" y="580" rx="10" width="80" height="50" class="green"/><text x="1214" y="610" class="chip">8 · MERGE</text>
  </g>

  <rect x="205" y="670" rx="18" width="890" height="190" class="dash"/>
  <text x="520" y="700" class="h2">AI workers running in parallel</text>
  <g>
    <rect x="235" y="725" rx="12" width="185" height="105" class="task"/><text x="255" y="755" class="h2">Rider Agent · T002</text><text x="255" y="780" class="small">Engine session</text><text x="255" y="800" class="small">Task worktree</text><rect x="255" y="810" rx="8" width="68" height="16" class="status"/>
    <rect x="445" y="725" rx="12" width="185" height="105" class="task"/><text x="465" y="755" class="h2">Driver Agent · T003</text><text x="465" y="780" class="small">Engine session</text><text x="465" y="800" class="small">Task worktree</text><rect x="465" y="810" rx="8" width="68" height="16" class="status"/>
    <rect x="655" y="725" rx="12" width="185" height="105" class="task"/><text x="675" y="755" class="h2">Backend · T004</text><text x="675" y="780" class="small">Engine session</text><text x="675" y="800" class="small">Task worktree</text><rect x="675" y="810" rx="8" width="68" height="16" fill="#fff4d7" stroke="#d9b44a"/>
    <rect x="865" y="725" rx="12" width="185" height="105" class="task"/><text x="885" y="755" class="h2">Realtime · T005</text><text x="885" y="780" class="small">Engine session</text><text x="885" y="800" class="small">Task worktree</text><rect x="885" y="810" rx="8" width="68" height="16" class="status"/>
  </g>

  <rect x="1330" y="485" rx="16" width="225" height="430" class="panel"/>
  <text x="1355" y="520" class="h2">Chat Scope</text>
  <text x="1355" y="560" class="body">Global / manual chat</text><path d="M1440 570 V595" class="arrow"/>
  <text x="1355" y="625" class="body">Company context</text><path d="M1440 635 V660" class="arrow"/>
  <text x="1355" y="690" class="body">Project chat</text><path d="M1440 700 V725" class="arrow"/>
  <text x="1355" y="755" class="body">Task session</text>
  <text x="1355" y="805" class="small">Organization-run sessions are</text><text x="1355" y="824" class="small">project/task attributed today.</text>
  <text x="1355" y="855" class="small">Explicit manual company/task</text><text x="1355" y="874" class="small">chat scopes remain follow-on UI.</text>

  <rect x="45" y="945" rx="16" width="1510" height="70" class="panel"/>
  <text x="70" y="975" class="h2">Portfolio View</text>
  <text x="230" y="975" class="body">Taxi Co · 3 running · 1 needs you</text>
  <text x="585" y="975" class="body">Ecommerce Co · 2 running · 0 blocked</text>
  <text x="970" y="975" class="body">SaaS Co · 5 running · 2 review</text>
  <text x="70" y="997" class="small">Multiple companies. Multiple projects. Multiple workers. Independent task transactions. One ND control plane.</text>
</svg>

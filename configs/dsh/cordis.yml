# ND DSH runtime composition.
# DeepSeek Harness is launched by the TypeScript SDK over stdio JSON-RPC.
# The browser MCP process attaches to the same Electron CDP target the user sees.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    maxParallelToolCalls: 4
    workspaceContext:
      maxBytes: 65536
    toolBash: !!js process.platform === 'win32' ? false : {}
    persona: |
      You are the coding agent inside ND DSH, an Electron desktop IDE. The current workspace and runtime policy are supplied separately in context.

      Inspect existing code before changing it, keep changes focused, and verify edits with the shell or project checks.

      The MCP server named browser controls the exact Electron browser pane visible to the user. Never launch or attach to a second browser. Before browser interaction, take a fresh accessibility snapshot and use its semantic references. Snapshot again after navigation or major DOM changes because references can become stale. Use console and network diagnostics only when they materially help, and treat cookies and storage as sensitive.
    skills:
      filesystem:
        customSkillDirs:
          - !!js process.env.ND_DSH_PROJECT_SKILL_DIR

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

- id: attachments
  name: '@deepseek-ai/dsh-attachment-local'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

# The SDK automation transport has no human approval responder. Keep
# escalation deterministic and fail-closed until the desktop approval bridge
# in roadmap milestone 4 is implemented. Workspace-contained operations are
# still governed by the selected sandbox mode.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'
  disabled: !!js process.platform !== 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# In-process subagents. Notifications are carried back to the desktop by the
# official SDK stream.
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: browser-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: browser
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.env.ND_DSH_AGENT_BROWSER_ENTRY
      - mcp
      - --tools
      - core,network,state,debug,tabs,react
    env:
      PATH: !!js process.env.PATH
      AGENT_BROWSER_CONFIG: !!js process.env.ND_DSH_AGENT_BROWSER_CONFIG
      AGENT_BROWSER_SESSION: !!js process.env.ND_DSH_AGENT_BROWSER_SESSION
    toolCallTimeoutMs: 120000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 30000
      maxAttempts: 10

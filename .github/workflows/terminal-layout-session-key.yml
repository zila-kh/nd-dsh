name: terminal-layout-session-key

on:
  push:
    branches:
      - feature/session-isolated-terminal

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Apply session layout remount fix
        run: node scripts/terminal-layout-session-key.mjs
      - name: Install desktop dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify repository invariants
        run: corepack pnpm verify
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Unit tests
        run: corepack pnpm test
      - name: Build desktop
        run: corepack pnpm build
      - name: Desktop smoke tests
        run: xvfb-run --auto-servernum corepack pnpm e2e
      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/terminal-layout-session-key.yml scripts/terminal-layout-session-key.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/renderer/src/components/TerminalDock.tsx .github/workflows/terminal-layout-session-key.yml scripts/terminal-layout-session-key.mjs
          git commit -m "fix(terminal): restore split layout per chat"
          git push origin HEAD:feature/session-isolated-terminal

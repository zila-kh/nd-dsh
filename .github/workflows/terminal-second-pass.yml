name: terminal-second-pass

on:
  push:
    branches:
      - feature/session-isolated-terminal

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Apply second-pass terminal fixes
        run: node scripts/terminal-second-pass.mjs
      - name: Install desktop dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify repository invariants
        run: corepack pnpm verify
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Unit tests
        run: corepack pnpm test
      - name: Build desktop
        run: corepack pnpm build
      - name: Desktop smoke tests including real PTY
        run: xvfb-run --auto-servernum corepack pnpm e2e
      - name: Commit validated hardening
        shell: bash
        run: |
          rm .github/workflows/terminal-second-pass.yml scripts/terminal-second-pass.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/main/terminal/terminal-manager.ts src/renderer/src/components/TerminalDock.tsx tests/terminal-manager.test.ts e2e/smoke.spec.ts .github/workflows/terminal-second-pass.yml scripts/terminal-second-pass.mjs
          git status --short
          git commit -m "fix(terminal): persist split ratios and harden recovery"
          git push origin HEAD:feature/session-isolated-terminal

name: Publish ND-DSH source

on:
  push:
    branches: [main]
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'zila-kh/nd-dsh'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and publish source tree
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/source.part-00 \
            .bootstrap/source.part-01a \
            .bootstrap/source.part-01b \
            .bootstrap/source.part-02 \
            .bootstrap/source.part-03 \
            .bootstrap/source.part-04 \
            .bootstrap/source.part-05 \
            > /tmp/nd-dsh-source.b64
          base64 --decode /tmp/nd-dsh-source.b64 > /tmp/nd-dsh-source.tar.gz
          echo '4bf2fcff2d032f1aeeba85af7b86e5611198aab6ae01280cd6ae32e60cdddc71  /tmp/nd-dsh-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/nd-dsh-source.tar.gz -C .

          test -f package.json
          test -f src/main/index.ts
          test -f scripts/verify.mjs
          test -f .gitmodules

          rm -f .bootstrap/source.part-*

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git update-index --add --cacheinfo 160000,141eb6fef83422698aef7a981029e843e8161534,vendor/deepseek-harness
          git diff --cached --check
          git commit -m 'feat: publish ND-DSH desktop IDE'
          git push origin HEAD:main

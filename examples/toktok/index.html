<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="TokTok — Short-form video feed built with Vanilla JS and CSS. Zero external URLs, zero backend server required. Procedural canvas video simulations and offline Web Audio synthesis.">
  <meta name="color-scheme" content="dark">
  <title>TokTok — Short Video Feed (Vanilla JS)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Accessibility Live Region for Screen Readers -->
  <div id="ariaAnnouncer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Desktop Outer Wrapper -->
  <div class="desktop-wrapper">
    <div class="desktop-ambient-glow" aria-hidden="true"></div>

    <!-- Phone Simulator Shell -->
    <main class="app-container" id="appContainer" role="region" aria-label="TokTok Short Video Application">
      
      <!-- Desktop Controls Bar (Simulator Header) -->
      <aside class="desktop-controls-bar" aria-label="Simulator Controls">
        <div class="app-brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.29 0 .58.04.85.12V9.41a6.33 6.33 0 0 0-.85-.06A6.34 6.34 0 0 0 3 15.69a6.34 6.34 0 0 0 10.82 4.48c1.66-1.63 1.95-4.13 1.95-6.52V8.08a8.28 8.28 0 0 0 3.82.91V6.69z"/>
          </svg>
          <span>TokTok</span>
          <span class="brand-badge">Build &amp; Ship</span>
        </div>
        <div class="desktop-actions">
          <button id="audioMasterBtn" class="btn-ctrl" title="Toggle Synthesized Audio (Shortcut: M)" aria-label="Toggle Audio">
            <svg id="audioIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
            <span id="audioStatusText">Muted</span>
          </button>
          <button id="fullscreenBtn" class="btn-ctrl" title="Toggle Fullscreen Mode" aria-label="Toggle Fullscreen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
            <span>Full</span>
          </button>
        </div>
      </aside>

      <!-- App Header: Live Button, Feed Tabs, Search Button -->
      <header class="app-header" role="banner">
        <button class="live-badge" id="liveBtn" title="LIVE Streams" aria-label="LIVE Streams">
          <span class="live-dot" aria-hidden="true"></span>
          <span>LIVE</span>
        </button>

        <nav class="feed-tabs" role="tablist" aria-label="Video feeds">
          <button class="tab-btn" id="tabFollowing" role="tab" aria-selected="false" aria-controls="feedContainer">Following</button>
          <button class="tab-btn active" id="tabForYou" role="tab" aria-selected="true" aria-controls="feedContainer">For You</button>
        </nav>

        <button class="header-btn" id="searchOpenBtn" title="Search Feed" aria-label="Open Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </header>

      <!-- Search Bar Overlay -->
      <div class="search-overlay" id="searchOverlay" role="search" aria-hidden="true">
        <div class="search-input-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search creators, captions, #tags..." aria-label="Search">
          <button type="button" id="searchClearBtn" class="search-clear-btn" aria-label="Clear Search" style="display: none;">&times;</button>
        </div>
        <button type="button" id="searchCloseBtn" class="search-close-btn">Cancel</button>
      </div>

      <!-- Main Feed Container with Snap-Scroll -->
      <section class="feed-container" id="feedContainer" role="feed" aria-label="Short Video Feed" tabindex="0">
        <!-- Dynamic video slides will be injected by app.js -->
      </section>

      <!-- Video Progress Bar (Global bottom scrubber) -->
      <div class="progress-bar-container" id="progressBarContainer" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" title="Video Progress">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>

      <!-- Bottom Navigation Bar -->
      <nav class="bottom-nav" role="navigation" aria-label="Main Navigation">
        <button class="nav-item active" id="navHome" aria-label="Home Feed" aria-current="page">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          <span>Home</span>
        </button>

        <button class="nav-item" id="navDiscover" aria-label="Discover">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
          <span>Discover</span>
        </button>

        <button class="nav-create-btn" id="navCreate" title="Create Custom Procedural Video" aria-label="Create Video">
          <div class="create-btn-bg" aria-hidden="true"></div>
          <span class="create-btn-icon" aria-hidden="true">+</span>
        </button>

        <button class="nav-item" id="navInbox" aria-label="Inbox notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="nav-badge-count">3</span>
          <span>Inbox</span>
        </button>

        <button class="nav-item" id="navProfile" aria-label="Profile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Profile</span>
        </button>
      </nav>

      <!-- Comment Drawer Bottom Sheet -->
      <div class="comment-drawer-backdrop" id="commentBackdrop" aria-hidden="true"></div>
      <section class="comment-drawer" id="commentDrawer" role="dialog" aria-modal="true" aria-labelledby="commentDrawerTitle" aria-hidden="true">
        <div class="drawer-header">
          <div class="drawer-drag-pill" aria-hidden="true"></div>
          <h2 class="drawer-title" id="commentDrawerTitle">Comments</h2>
          <button class="drawer-close-btn" id="commentCloseBtn" aria-label="Close comments">&times;</button>
        </div>

        <div class="comment-list" id="commentList" tabindex="0" role="region" aria-label="Comments list">
          <!-- Comments dynamically injected here -->
        </div>

        <div class="comment-input-area">
          <div class="quick-emojis" aria-label="Quick emojis">
            <button type="button" class="emoji-btn" data-emoji="❤️">❤️</button>
            <button type="button" class="emoji-btn" data-emoji="🔥">🔥</button>
            <button type="button" class="emoji-btn" data-emoji="😂">😂</button>
            <button type="button" class="emoji-btn" data-emoji="👏">👏</button>
            <button type="button" class="emoji-btn" data-emoji="💯">💯</button>
            <button type="button" class="emoji-btn" data-emoji="✨">✨</button>
            <button type="button" class="emoji-btn" data-emoji="🚀">🚀</button>
          </div>
          <form class="comment-form" id="commentForm">
            <input type="text" class="comment-input" id="commentTextInput" placeholder="Add comment..." maxlength="200" aria-label="Comment text" autocomplete="off">
            <button type="submit" class="comment-submit-btn" id="commentSubmitBtn" aria-label="Post comment" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </section>

      <!-- Share Dialog Modal -->
      <div class="modal-backdrop" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle" aria-hidden="true">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title" id="shareModalTitle">Share to</h2>
            <button class="drawer-close-btn" id="shareCloseBtn" aria-label="Close share dialog">&times;</button>
          </div>

          <div class="share-options-grid">
            <button class="share-opt-btn" id="shareCopyLinkBtn" type="button">
              <div class="share-icon-circle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
              </div>
              <span>Copy Link</span>
            </button>

            <button class="share-opt-btn" id="shareWhatsAppBtn" type="button">
              <div class="share-icon-circle" style="background: rgba(37, 211, 102, 0.2); color: #25D366;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
              </div>
              <span>WhatsApp</span>
            </button>

            <button class="share-opt-btn" id="shareTwitterBtn" type="button">
              <div class="share-icon-circle" style="background: rgba(29, 161, 242, 0.2); color: #1DA1F2;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
                </svg>
              </div>
              <span>Twitter/X</span>
            </button>

            <button class="share-opt-btn" id="shareQrBtn" type="button">
              <div class="share-icon-circle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
              </div>
              <span>QR Code</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Create Custom Video Modal -->
      <div class="modal-backdrop" id="createModal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle" aria-hidden="true">
        <div class="modal-content create-modal-content">
          <div class="modal-header">
            <h2 class="modal-title" id="createModalTitle">Create Procedural Video</h2>
            <button class="drawer-close-btn" id="createCloseBtn" aria-label="Close create dialog">&times;</button>
          </div>

          <form id="createVideoForm" style="display:flex; flex-direction:column; gap:12px;">
            <div class="form-group">
              <label class="form-label" for="createVisualType">Visual Animation Engine</label>
              <select id="createVisualType" class="form-select" required>
                <option value="cyber-neon">Cyber Neon Pulse &amp; Spectrum</option>
                <option value="lofi-coffee">Cozy Lo-Fi Coffee Rain</option>
                <option value="fluid-wave">Hypnotic Fluid Wave &amp; Particles</option>
                <option value="matrix-code">Matrix Terminal Code Stream</option>
                <option value="sunset-drive">Retro Synthwave 3D Highway</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="createCreatorHandle">Your Creator Handle</label>
              <input type="text" id="createCreatorHandle" class="form-input" placeholder="@yourname" value="@creator_spark" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="createCaption">Video Caption &amp; Hashtags</label>
              <textarea id="createCaption" class="form-textarea" rows="2" placeholder="Describe your video #fyp #buildandship" required>Built with pure Vanilla JS and CSS! #buildandship #toktok #offline</textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="createSoundTitle">Sound Title</label>
              <input type="text" id="createSoundTitle" class="form-input" placeholder="Original Sound..." value="Original Sound - Procedural Beat by @creator_spark" required>
            </div>

            <button type="submit" class="btn-primary-gradient">Publish to TokTok Feed</button>
          </form>
        </div>
      </div>

      <!-- Floating App Toast Notification -->
      <div class="app-toast" id="appToast" role="alert" aria-live="polite"></div>

    </main>
  </div>

  <!-- Vanilla JavaScript Application (classic scripts: runs from file:// with no server) -->
  <script src="data.js"></script>
  <script src="canvas-engine.js"></script>
  <script src="audio-synth.js"></script>
  <script src="app.js"></script>
</body>
</html>
